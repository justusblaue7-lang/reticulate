# Decision anatomy: structural features a real decision can have.
#
# The decision mode rates each feature for a decision (0 absent, 1 minor, 2 present,
# 3 central). Features with a meta-analytic map contribute to the decision's neural
# signature: the level-weighted mean of their maps, computed separately for NeuroQuery and
# Neurosynth. `neuroquery` is a NeuroQuery query; `neurosynth` lists Neurosynth terms, and
# a study counts when its abstract uses any of them. An empty list means Neurosynth's
# abstract vocabulary has no term for the construct; the feature then has a NeuroQuery map
# only, and the two sources are compared only where both have one.
#
# `question` is what Claude rates; `ask` is the same question put to the user in the self-check.
# `dimensions` are the attitudes the feature engages (by definition: a possible loss engages
# the attitude to risk); `mechanisms`
# refer to mechanisms.yaml; `note` flags a map whose literature only partly fits.

version: 1.0.0

features:
- id: possible_loss
  name: Possible loss
  question: Could the decision-maker lose something they already have, such as money, position, health
    or relationships?
  ask: 'Could you lose something you already have: money, position, health or relationships?'
  neuroquery: loss anticipation monetary loss aversion
  neurosynth:
  - losses
  - punishment
  dimensions:
  - risk_taking
  mechanisms:
  - loss_aversion
  - framing
- id: known_risk
  name: Risk with estimable odds
  question: Do outcomes vary in ways whose probabilities can be estimated, for example from base rates
    or experience?
  ask: Can the odds be estimated, from base rates or experience?
  neuroquery: risk taking gambling
  neurosynth:
  - risk taking
  - gambling
  dimensions:
  - risk_taking
  mechanisms:
  - probability_weighting
- id: upside
  name: Potential gain
  question: Is there a substantial reward to be won, such as money, status or opportunity?
  ask: 'Is there a substantial gain to be won: money, status or opportunity?'
  neuroquery: reward anticipation monetary reward
  neurosynth:
  - reward anticipation
  - monetary incentive
  - reward
  dimensions:
  - risk_taking
  mechanisms:
  - probability_weighting
- id: unknown_odds
  name: Unknown odds
  question: Are the probabilities themselves unknown, so that nobody could say how likely the outcomes
    are?
  ask: Is it impossible to say how likely the outcomes are?
  neuroquery: decision uncertainty uncertainty
  neurosynth:
  - uncertainty
  - uncertain
  dimensions:
  - risk_taking
  mechanisms:
  - ambiguity_aversion
- id: delayed_outcomes
  name: Delayed consequences
  question: Do important costs or benefits arrive only months or years after the choice?
  ask: Do important costs or benefits arrive only months or years later?
  neuroquery: delay discounting intertemporal choice
  neurosynth: []
  dimensions:
  - patience
  mechanisms:
  - present_bias
- id: temptation
  name: Immediate temptation
  question: Is there a tempting short-term option that conflicts with longer-term goals?
  ask: Is there a tempting short-term option that conflicts with your longer-term goals?
  neuroquery: self control impulsivity craving
  neurosynth:
  - impulsivity
  - impulsive
  - craving
  dimensions:
  - patience
  mechanisms:
  - present_bias
- id: default_option
  name: A default to keep
  question: Is one option simply to keep things as they are?
  ask: Is one option simply to keep things as they are?
  neuroquery: ''
  neurosynth: []
  dimensions: []
  mechanisms:
  - status_quo_bias
- id: prior_investment
  name: Prior investment
  question: Have time, money or reputation already been committed to one course of action?
  ask: Have you already put time, money or reputation into one course?
  neuroquery: ''
  neurosynth: []
  dimensions: []
  mechanisms:
  - sunk_cost
- id: numbers
  name: A number to judge
  question: Does the decision turn on a number to judge or set, such as a price, a salary, a budget or
    a timeline?
  ask: 'Does it turn on a number: a price, a salary, a budget or a timeline?'
  neuroquery: ''
  neurosynth: []
  dimensions: []
  mechanisms:
  - anchoring
  - overconfidence
- id: complexity
  name: Analytical complexity
  question: Does a good answer require holding many variables in mind, calculating or reasoning step by
    step?
  ask: Does a good answer require calculating, or holding many things in mind at once?
  neuroquery: reasoning working memory calculation
  neurosynth:
  - reasoning
  - working memory
  - calculation
  dimensions: []
  mechanisms:
  - overconfidence
- id: early_leaning
  name: An early favourite
  question: Does the decision-maker already lean toward one option before the options have been weighed?
  ask: Do you already lean toward one option?
  neuroquery: ''
  neurosynth: []
  dimensions: []
  mechanisms:
  - confirmation_bias
- id: social_influence
  name: Others' opinions
  question: Will what peers, family or the public think or do weigh on the choice?
  ask: Will what peers, family or the public think weigh on you?
  neuroquery: conformity social norms
  neurosynth: []
  dimensions: []
  mechanisms:
  - social_conformity
- id: others_affected
  name: Consequences for others
  question: Does the choice change the welfare of other people, or raise questions of fair shares?
  ask: Will the choice change other people's welfare, or raise questions of fair shares?
  neuroquery: altruistic cooperation
  neurosynth: []
  dimensions:
  - altruism
  mechanisms: []
- id: relying_on_others
  name: Relying on others
  question: Does the outcome depend on trusting another party to act as promised?
  ask: Does the outcome depend on someone else keeping their word?
  neuroquery: trust trustworthiness
  neurosynth: []
  dimensions:
  - trust
  mechanisms: []
  note: The 'trust' literature in NeuroQuery is dominated by judgements of facial trustworthiness (amygdala);
    trust-game studies, which implicate the caudate, are a minority. Read this map as a rough proxy.
- id: obligations
  name: Owing someone
  question: Does the decision touch what the decision-maker owes to people who helped them, or what others
    owe them?
  ask: Does it touch what you owe people who helped you, or what they owe you?
  neuroquery: ''
  neurosynth: []
  dimensions:
  - positive_reciprocity
  mechanisms: []
- id: unfair_treatment
  name: Unfair treatment
  question: Has the decision-maker been treated unfairly in this matter, so that answering it is part
    of the choice?
  ask: Have you been treated unfairly in this, and is answering that part of the choice?
  neuroquery: ''
  neurosynth: []
  dimensions:
  - negative_reciprocity
  mechanisms: []
- id: anticipated_regret
  name: Possible regret
  question: Will the decision-maker learn how the option not taken would have turned out?
  ask: Will you find out how the option you did not take would have turned out?
  neuroquery: regret
  neurosynth: []
  dimensions: []
  mechanisms:
  - anticipated_regret
- id: learning_from_outcomes
  name: Judged by its outcome
  question: Will the outcome become visible later, so that the decision is likely to be judged by how
    it turned out?
  ask: Will you see later how it turned out, and judge the decision by that?
  neuroquery: prediction error reinforcement learning feedback
  neurosynth:
  - prediction error
  - reinforcement learning
  - feedback
  dimensions: []
  mechanisms:
  - hindsight_bias
