# Attitudes of the Reticulate profile model: the six preferences of the Global Preferences
# Survey (falk2018), asked of about 80,000 people in 76 countries, with the survey items
# validated against incentivised choices with real money (falk2023; for risk, dohmen2011).
#
# Every profile has a value on 0–10 for each: the answer to the survey question, 0 one end of
# the answer scale, 10 the other. 5 is the middle of the scale, not the population average.
# Values describe a person's general attitude, not how they will decide a particular case.
#
# `reasoning.low` / `reasoning.high` are the behavioural anchors the prompt compiler hands to
# the reasoning engine for a simulated decision-maker. They paraphrase the behaviour the
# preference is measured by and the behaviour it was found to go with in the cited studies.
#
# Changes to this file are science changes: they need review (docs/epistemics.md).

version: 1.0.0

dimensions:
  - id: risk_taking
    name: Risk taking
    low_pole: Cautious
    high_pole: Risk-taking
    definition: >-
      General willingness to take risks: to accept a chance of losing for a chance of gaining
      more.
    constructs: [stated risk attitude, risky choice with real money]
    instruments:
      - {id: gps_risk, name: "Global Preferences Survey: willingness to take risks (0–10)", kind: questionnaire, ref: falk2023}
    notes: >-
      The single question predicted choices between real lotteries and safe payments, and it
      went with holding stocks, self-employment, smoking and active sports in a sample of
      about 22,000 adults (dohmen2011).
    refs: [dohmen2011, falk2018, falk2023]
    reasoning:
      low: >-
        Prefers the safe option when outcomes are uncertain, gives up some expected gain to
        avoid a chance of losing, and sizes the downside first.
      high: >-
        Accepts a real chance of losing for a chance of gaining more, and is drawn to the
        option with the larger possible upside.

  - id: patience
    name: Patience
    low_pole: Wants it now
    high_pole: Patient
    definition: >-
      Willingness to give up something beneficial today in order to benefit more in the
      future.
    constructs: [time preference, intertemporal choice with real money]
    instruments:
      - {id: gps_patience, name: "Global Preferences Survey: willingness to give up something today for more in the future (0–10)", kind: questionnaire, ref: falk2023}
    notes: >-
      The question predicted choices between smaller earlier and larger later payments with
      real money (falk2023). Across 76 countries, more patient people saved more and had more
      education (falk2018).
    refs: [falk2018, falk2023]
    reasoning:
      low: >-
        Weighs what an option brings soon much more than what it brings later, and takes the
        earlier, smaller benefit over a later, larger one.
      high: >-
        Gives up something now for a larger benefit later: saves, invests in education and
        skills, and judges options by where they lead in a few years.

  - id: altruism
    name: Altruism
    low_pole: Self-focused
    high_pole: Giving
    definition: >-
      Willingness to give to good causes without expecting anything in return.
    constructs: [altruism, donating]
    instruments:
      - {id: gps_altruism, name: "Global Preferences Survey: willingness to give to good causes (0–10)", kind: questionnaire, ref: falk2023}
    notes: >-
      The question predicted giving in a real-money donation choice (falk2023), and went with
      donating, volunteering and helping strangers (falk2018).
    refs: [falk2018, falk2023]
    reasoning:
      low: >-
        Judges an option mainly by what it brings them and the people closest to them.
      high: >-
        Counts what an option does for others and for causes they care about, and will give up
        something of their own for it without expecting a return.

  - id: trust
    name: Trust
    low_pole: Wary
    high_pole: Trusting
    definition: >-
      The assumption that other people have only the best intentions.
    constructs: [generalised trust]
    instruments:
      - {id: gps_trust, name: "Global Preferences Survey: \"I assume that people have only the best intentions\" (0–10)", kind: questionnaire, ref: falk2023}
    notes: >-
      Part of the validated survey module (falk2023); its global distribution is reported in
      falk2018.
    refs: [falk2018, falk2023]
    reasoning:
      low: >-
        Assumes others may act in their own interest, wants commitments in writing and checks
        what depends on other people keeping their word.
      high: >-
        Assumes others mean well, relies on what people say and on informal agreements.

  - id: positive_reciprocity
    name: Positive reciprocity
    low_pole: Keeps no score
    high_pole: Returns favours
    definition: >-
      Willingness to return a favour.
    constructs: [positive reciprocity]
    instruments:
      - {id: gps_pos_reciprocity, name: "Global Preferences Survey: \"When someone does me a favour, I am willing to return it\" (0–10)", kind: questionnaire, ref: falk2023}
    notes: >-
      The question predicted returning a favour in an incentivised choice (falk2023). Most
      people answer toward the top of the scale (falk2018).
    refs: [falk2018, falk2023]
    reasoning:
      low: >-
        Does not feel bound by favours received; what others did for them weighs little in a
        choice.
      high: >-
        Feels bound to people who helped them and counts what they owe others when choosing.

  - id: negative_reciprocity
    name: Negative reciprocity
    low_pole: Lets it go
    high_pole: Pushes back
    definition: >-
      Willingness to punish someone who treats one unfairly, even at a cost to oneself.
    constructs: [negative reciprocity, costly punishment]
    instruments:
      - {id: gps_neg_reciprocity, name: "Global Preferences Survey: willingness to punish unfair treatment at a cost (0–10)", kind: questionnaire, ref: falk2023}
    notes: >-
      The question predicted costly punishment of unfair behaviour in an incentivised choice
      (falk2023).
    refs: [falk2018, falk2023]
    reasoning:
      low: >-
        Lets unfair treatment pass rather than pay a price to answer it, and looks ahead
        rather than back.
      high: >-
        Answers unfair treatment even when it costs them, and weighs how they were treated
        heavily in what they do next.
