# Decision biases: documented regularities in how people decide.
#
# The bar for this file (docs/epistemics.md): a bias is listed only when it holds up in a
# meta-analysis, a multi-site replication, a large sample (about 1,000 people or more) or
# field data. Each states what was found and where.
#
# `countermove` is a remedy, listed only when the same bar holds for the remedy itself: a
# meta-analysis or randomised field trials show that it works. Most biases have none that
# meets it, and then none is given.
#
# `dimensions` names attitudes (dimensions.yaml) the bias is measured with or validated
# against; it is empty when no such link has been shown.
#
# Changes to this file are science changes: they need review (docs/epistemics.md).

version: 1.0.0

mechanisms:
  - id: loss_aversion
    name: Loss aversion
    summary: >-
      Losses weigh more than gains of the same size: a possible loss needs to be offset by a
      gain about twice as large before people take the bet.
    evidence:
      - design: meta_analysis
        finding: >-
          A meta-analysis of published estimates across experiments and field data put the
          typical loss-aversion coefficient near 2.
        refs: [brown2024]
    dimensions: []
    refs: [kahneman1979, brown2024]

  - id: probability_weighting
    name: Probability weighting
    summary: >-
      Small chances are given too much weight and near-certainties too little, so long shots
      look attractive and a sure thing looks better than it is.
    evidence:
      - design: replication
        finding: >-
          The classic prospect-theory choice patterns, including the certainty effect and the
          overweighting of small probabilities, replicated across 19 countries with 4,098
          participants.
        refs: [ruggeri2020]
    dimensions: []
    refs: [tversky1992, ruggeri2020]
    countermove:
      text: >-
        Put the chances as frequencies: out of 100 people in this situation, how many end up
        where you hope, and how many do not?
      finding: >-
        Across experiments, people reasoned about chances more accurately when the numbers
        came as natural frequencies ("8 out of 100") than as percentages (meta-analysis), and
        decision aids that set out outcomes with their chances made people's risk estimates
        more accurate (Cochrane review of 105 trials).
      refs: [mcdowell2017, stacey2017]

  - id: ambiguity_aversion
    name: Ambiguity aversion
    summary: >-
      People avoid options whose odds are unknown, even when the unknown odds are no worse
      than the known ones.
    evidence:
      - design: field
        finding: >-
          In a representative sample of US households, most respondents avoided bets with
          unknown odds, and those who did were less likely to own stocks.
        refs: [dimmock2016]
    dimensions: []
    refs: [ellsberg1961, dimmock2016]

  - id: framing
    name: Framing effect
    summary: >-
      The same choice described as gains or as losses leads to different decisions: people
      play safe with gains and take risks to avoid losses.
    evidence:
      - design: replication
        finding: Replicated across 36 samples and 6,344 participants in the Many Labs project.
        refs: [klein2014]
      - design: meta_analysis
        finding: A meta-analysis of the framing literature confirmed the effect for risky choices.
        refs: [kuhberger1998]
    dimensions: []
    refs: [tversky1981, klein2014, kuhberger1998]

  - id: anchoring
    name: Anchoring
    summary: >-
      A number seen first, even an irrelevant one, pulls estimates and offers toward it: a
      first price, a salary figure, a first guess at a timeline.
    evidence:
      - design: replication
        finding: Among the largest and most consistent effects across 36 samples and 6,344 participants in the Many Labs project.
        refs: [klein2014]
    dimensions: []
    refs: [klein2014]

  - id: sunk_cost
    name: Sunk-cost effect
    summary: >-
      Money, time or effort already spent keeps people in a course of action, although only
      what lies ahead should count.
    evidence:
      - design: replication
        finding: Replicated across 36 samples and 6,344 participants in the Many Labs project, with a small effect.
        refs: [klein2014]
    dimensions: []
    refs: [arkes1985, klein2014]

  - id: present_bias
    name: Present bias
    summary: >-
      What comes now weighs more than what comes later, beyond what waiting costs: people
      take the sooner, smaller benefit and put off what pays off only later.
    evidence:
      - design: replication
        finding: >-
          Choices between sooner and later money showed discounting of the future in all 61
          countries of a study with 13,629 participants.
        refs: [ruggeri2022]
      - design: field
        finding: >-
          Patience, measured with the survey question used here, varies widely between people
          and goes with saving and education across 76 countries.
        refs: [falk2018]
    dimensions: [patience]
    refs: [ruggeri2022, falk2018]
    countermove:
      text: >-
        Decide now what you will do later, and bind it: a step that happens automatically, or
        a commitment that is hard to undo.
      finding: >-
        In randomised field trials, people given a way to commit in advance saved more: a
        commitment savings account in the Philippines, and Save More Tomorrow, where saving
        rates rose from 3.5% to 13.6% over 40 months.
      refs: [ashraf2006, thaler2004]

  - id: status_quo_bias
    name: Status quo bias
    summary: >-
      The current state or the default option is kept more often than its merits justify.
    evidence:
      - design: meta_analysis
        finding: A meta-analysis of 58 studies with 73,675 participants found that defaults shift choices substantially.
        refs: [jachimowicz2019]
      - design: field
        finding: When a company made pension saving the default, participation rose from 37% to 86% of new employees.
        refs: [madrian2001]
    dimensions: []
    refs: [samuelson1988, jachimowicz2019, madrian2001]

  - id: overconfidence
    name: Overconfidence
    summary: >-
      People are surer of their estimates than they should be: the ranges they give for
      costs, timelines and outcomes are too narrow.
    evidence:
      - design: field
        finding: >-
          In over 13,300 forecasts by chief financial officers, the realised market return fell
          inside their 80% confidence range only 36% of the time.
        refs: [bendavid2013]
    dimensions: []
    refs: [moore2008, bendavid2013]

  - id: social_conformity
    name: Social conformity
    summary: >-
      People adjust their judgement toward what others say, even when the others are
      plainly wrong.
    evidence:
      - design: meta_analysis
        finding: A meta-analysis of 133 Asch-type studies from 17 countries found conformity in every culture studied, stronger in collectivist ones.
        refs: [bond1996]
    dimensions: []
    refs: [bond1996]

  - id: anticipated_regret
    name: Anticipated regret
    summary: >-
      The regret people expect to feel steers what they choose, often toward the option they
      could least blame themselves for.
    evidence:
      - design: meta_analysis
        finding: In a meta-analysis of 81 studies with 45,618 participants, anticipated regret predicted intentions and behaviour.
        refs: [brewer2016]
    dimensions: []
    refs: [brewer2016]

  - id: confirmation_bias
    name: Confirmation bias
    summary: >-
      People seek out information that supports what they already lean toward and pass over
      information that challenges it.
    evidence:
      - design: meta_analysis
        finding: Across 91 studies with about 8,000 participants, people preferred information that confirmed their views (meta-analysis of selective exposure).
        refs: [hart2009]
    dimensions: []
    refs: [hart2009]

  - id: hindsight_bias
    name: Hindsight bias
    summary: >-
      Once the outcome is known, people believe it was more predictable than it was, and
      judge the decision by how it turned out.
    evidence:
      - design: meta_analysis
        finding: A meta-analysis of hindsight research confirmed the effect across tasks and populations.
        refs: [guilbault2004]
    dimensions: []
    refs: [guilbault2004]
