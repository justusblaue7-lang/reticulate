# The dialogue: how Reticulate questions a decision.
#
# Its structure is that of patient decision aids, the format with the strongest trial
# evidence for helping people make informed decisions that fit what matters to them
# (stacey2017: a Cochrane review of 105 randomised trials with 31,043 people): the decision,
# the options, their outcomes and how likely they are, what matters to the person, and how
# the options compare on it. It ends with an if-then plan (gollwitzer2006).
#
# A move is a kind of question. A move carries a `finding` only when the bar of
# docs/epistemics.md holds for it (a meta-analysis or a systematic review of trials); the
# others are plain questions and claim nothing.
#
# Changes to this file are science changes: they need review (docs/epistemics.md).

version: 1.0.0

method:
  summary: >-
    One question at a time, in the person's own words, through the parts of a decision aid:
    the decision, the options, what is likely to happen with each, what matters to the
    person and how the options compare on it, then a first step as an if-then plan. In
    randomised trials, decision aids with these parts improved people's knowledge of their
    options, made their sense of the chances more accurate and led to choices that fit their
    values better (Cochrane review of 105 trials, 31,043 people).
  refs: [stacey2017, gollwitzer2006]

stages:
  - id: frame
    name: The decision
    aim: What exactly is being decided, by when, and what is fixed.
    refs: [stacey2017]
  - id: options
    name: Options
    aim: Every real option, including waiting or doing nothing.
    refs: [stacey2017]
  - id: evidence
    name: Outcomes
    aim: What is likely to happen with each option, and how likely, as plainly as the person can say it.
    refs: [stacey2017, mcdowell2017]
  - id: goals
    name: What matters
    aim: What the person cares about in this decision, most important first.
    refs: [stacey2017]
  - id: tradeoffs
    name: Weighing
    aim: How the options compare on what matters, and what each one costs.
    refs: [stacey2017]
  - id: commitment
    name: Commitment
    aim: The choice in the person's own words, and a first step as an if-then plan.
    refs: [gollwitzer2006]

moves:
  - id: clarify
    name: Clarify
    question: What exactly are you deciding, and by when?
    refs: []
  - id: options
    name: Options
    question: What else could you do, including waiting or doing nothing?
    finding: >-
      Decision aids that set out every option with its outcomes improved people's knowledge
      of their options and lowered their indecision (Cochrane review of 105 trials).
    refs: [stacey2017]
  - id: outcomes
    name: Outcomes and chances
    question: Out of 100 people in your place who choose this, how many would you expect to end up where you hope?
    finding: >-
      People judged chances more accurately when they came as frequencies than as percentages
      (meta-analysis), and decision aids that gave the chances of outcomes made people's risk
      estimates more accurate (Cochrane review).
    refs: [mcdowell2017, stacey2017]
  - id: values
    name: What matters
    question: Of everything at stake here, what matters most to you, and why?
    finding: >-
      Decision aids that ask people what matters to them led to choices more consistent with
      their values and left them less unclear about what they value (Cochrane review of 105
      trials).
    refs: [stacey2017]
  - id: check
    name: Check
    question: How do you know? What would change your mind?
    refs: []
  - id: bias
    name: A documented bias
    question: Asks about a bias from the list that fits what the person said, using its remedy where one is proven.
    refs: []
  - id: perspectives
    name: Other minds
    question: One of the minds at the table weighed this differently. What do you make of their reason?
    refs: []
  - id: commitment
    name: If-then plan
    question: When exactly will you take the first step, and what will you do if something gets in the way?
    finding: >-
      If-then plans for when, where and how to act had a medium-to-large effect on reaching
      goals across 94 tests with more than 8,000 participants (meta-analysis).
    refs: [gollwitzer2006]
