# The person's own pattern: the six questions of the Global Preferences Survey (falk2018),
# in the wording of the validated survey module (falk2023), each answered from 0 to 10.
# The answer is the value: 0 one end of the scale, 10 the other.
#
# `leanings` say what an answer toward one end has been found to go with in the cited
# studies, and which documented bias the same measure was validated against. They describe;
# they give no advice.
#
# Changes to this file are science changes: they need review (docs/epistemics.md).

version: 1.0.0

method:
  summary: >-
    Six questions from the Global Preferences Survey, asked of about 80,000 people in 76
    countries. Each was validated against choices with real money: the answer predicts how a
    person chooses between lotteries and safe amounts, between money now and more money
    later, how much they give, trust, return and punish. Your answers describe your attitudes
    in general; a particular decision can differ.
  refs: [falk2018, falk2023, dohmen2011]

items:
  - id: gps_risk
    dimension: risk_taking
    text: In general, how willing or unwilling are you to take risks?
    low: Completely unwilling to take risks
    high: Very willing to take risks
  - id: gps_patience
    dimension: patience
    text: How willing are you to give up something that is beneficial for you today in order to benefit more from that in the future?
    low: Completely unwilling
    high: Very willing
  - id: gps_altruism
    dimension: altruism
    text: How willing are you to give to good causes without expecting anything in return?
    low: Completely unwilling
    high: Very willing
  - id: gps_trust
    dimension: trust
    text: "How well does this describe you: I assume that people have only the best intentions."
    low: Does not describe me at all
    high: Describes me perfectly
  - id: gps_pos_reciprocity
    dimension: positive_reciprocity
    text: "How well does this describe you: When someone does me a favour, I am willing to return it."
    low: Does not describe me at all
    high: Describes me perfectly
  - id: gps_neg_reciprocity
    dimension: negative_reciprocity
    text: How willing are you to punish someone who treats you unfairly, even if there may be costs for you?
    low: Completely unwilling
    high: Very willing

leanings:
  - dimension: risk_taking
    low:
      watch: Answering low goes with choosing a safe amount over a lottery when real money is at stake, and with holding fewer stocks.
    high:
      watch: Answering high goes with choosing lotteries over safe amounts when real money is at stake, and with self-employment, stock holding and smoking.
  - dimension: patience
    low:
      watch: Answering low goes with taking smaller, sooner payments over larger, later ones when real money is at stake, and with saving less.
      mechanisms: [present_bias]
    high:
      watch: Answering high goes with waiting for larger, later payments when real money is at stake, and with saving more and longer education.
  - dimension: altruism
    low:
      watch: Answering low goes with giving less in a real donation choice.
    high:
      watch: Answering high goes with giving more in a real donation choice, and with donating, volunteering and helping strangers.
  - dimension: trust
    low:
      watch: Answering low means not assuming that other people have the best intentions.
    high:
      watch: Answering high means assuming that other people have the best intentions.
  - dimension: positive_reciprocity
    low:
      watch: Answering low means returning favours matters less to you than to most people, who answer near the top of this scale.
    high:
      watch: Answering high goes with returning a favour when real money is at stake.
  - dimension: negative_reciprocity
    low:
      watch: Answering low goes with letting unfair treatment pass rather than paying to punish it.
    high:
      watch: Answering high goes with punishing unfair treatment even when it costs you, when real money is at stake.
