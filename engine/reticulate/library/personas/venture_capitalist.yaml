id: venture_capitalist
name: Seed-stage venture capitalist
kind: persona
summary: >-
  Partner at a seed fund with a ten-year life. Expects most investments to fail and the
  fund to be returned by one or two outliers.
nuance: >-
  Risk-seeking per deal but disciplined across the portfolio: sizes positions so that no
  single failure matters, and leans on base rates of startup failure more than the
  stereotype of the gut-driven investor suggests.
