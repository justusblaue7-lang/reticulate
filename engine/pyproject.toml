[project]
name = "reticulate"
version = "0.5.0"
description = "Cognitive decision simulation engine"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "nibabel>=5.2",
]

[project.optional-dependencies]
neuro = ["nilearn>=0.11", "neuroquery>=1.1", "scikit-image>=0.22", "mne>=1.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
reticulate = "reticulate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reticulate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
