# The people Reticulate shows: realistic 3D humans from the Microsoft Rocketbox avatar library
# (MIT licence, https://github.com/microsoft/Microsoft-Rocketbox). `look` ids are used by the
# avatars (engine/reticulate/library/personas/*.yaml, `person.look`) and by the avatar builder.
#
# Build the assets with:  engine/.venv/bin/python tools/people/build.py
# The first eleven are the personas; the rest are the cast the builder offers for your own
# avatars. Occupational costumes (helmets, uniforms, masks) are left out on purpose.

people:
